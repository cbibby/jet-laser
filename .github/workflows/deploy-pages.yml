name: Deploy Jet Laser to GitHub Pages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify JavaScript syntax
        run: find src -name '*.js' -exec node --check {} +

      - name: Stage static site bundle
        run: |
          mkdir -p _site
          cp index.html styles.css .nojekyll _site/
          cp -R src _site/src

      - name: Package downloadable offline HTML5 zip for GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd _site
          zip -r "../JetLaser-${GITHUB_REF_NAME}.zip" .

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "JetLaser-${GITHUB_REF_NAME}.zip" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "JetLaser-${GITHUB_REF_NAME}.zip"               --title "Jet Laser ${GITHUB_REF_NAME}"               --generate-notes
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
